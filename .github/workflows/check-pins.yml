name: 校验子模块锁定版本与兼容矩阵

on:
  push:
    paths: ['README.md', 'README.en.md', 'compat-matrix.json', 'app', 'site', 'scripts/**']
  pull_request:
    paths: ['README.md', 'README.en.md', 'compat-matrix.json', 'app', 'site', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # 不拉 site（private）；app 下一步单独检出
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 检出 public 的 app 子模块
        # app 是 public，安全可拉；site 是 private，保持不检出。
        # 这样 check-compat-matrix.mjs 才能真读 build.gradle.kts 核对
        # 矩阵声明的 moxsh-terminal 版本（此前 CI 永远跳过这一步 = 假绿）。
        run: git submodule update --init --depth 1 app
      - name: README pin 必须等于真实 gitlink
        run: node scripts/check-submodule-pins.mjs
      - name: 兼容矩阵结构与本地版本一致性
        run: node scripts/check-compat-matrix.mjs
