name: 镜像到 Gitee（单向，GitHub 为唯一主源）
on:
  # 2026-11-13 审计：去掉 push 触发。
  # GitHub-hosted runner 在美国，实测到 gitee.com 的 git 连接稳定被
  # 「Recv failure: Connection reset by peer」阻断（run 43439774127 三次
  # 重试全挂，耗时 4m44s）。同一时刻从国内网络测 gitee.com 是 200 且
  # ls-remote 正常 —— 这是地域性网络阻断，不是代码或凭证问题。
  # 每次 push 都挂一个必红的 run 只会制造无意义告警；GitHub 本来就是唯一
  # 主源，镜像是单向冗余。改为定时同步 + 随时可手动补同步：
  # 定时 job 失败时仍真实 exit 1 并打印错误，不改成假绿。
  schedule:
    - cron: '23 */2 * * *'   # 每 2 小时兜底同步（原 6 小时，缩短同步窗口）
  workflow_dispatch:        # 允许手动触发补同步，或国内网络恢复后立即补推

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15     # 地域阻断时不要空耗 runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 全量历史，标签也要同步

      # Gitee hook 会拒绝任何未在账号公开的提交邮箱（GitHub noreply / QQ 邮箱都会拒）：
      #   Push will publish a hidden email, make email public or abandon related commits
      # 用 GITEE_TOKEN 查当前账号数字 ID，生成 Gitee 平台公开的备用邮箱：
      #   {ID}+{username}@user.noreply.gitee.com
      # ⚠️ 只换邮箱，绝不改名字：作者名必须保持 GitHub 原值（codecloud-dev / MoX Agent 等），
      #    否则 Gitee 页面提交者会被换成 login（codecloud-dev），与 GitHub 不一致。
      # 只重写这份临时的镜像工作副本，GitHub 主仓历史与 commit sha 完全不动。
      # 重写后 sha 会与 GitHub 不同，这是单向镜像的预期代价。
      - name: 镜像副本只替换提交邮箱为 Gitee 公开别名（保留原作者名，不动 GitHub 主仓）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          GITEE_EMAIL=$(curl -fsS "https://gitee.com/api/v5/user?access_token=${GITEE_TOKEN}" \
            | jq -r '"\(.id)+\(.login)@user.noreply.gitee.com"')
          if [ -z "$GITEE_EMAIL" ] || [[ "$GITEE_EMAIL" == null* ]] || [[ "$GITEE_EMAIL" != *"@user.noreply.gitee.com" ]]; then
            echo "::error::无法从 Gitee API 取到公开别名邮箱，拒绝推送"
            exit 1
          fi
          echo "镜像提交邮箱: $GITEE_EMAIL（作者名保留 GitHub 原值）"
          export GITEE_EMAIL
          git filter-branch -f --env-filter '
            export GIT_AUTHOR_EMAIL="$GITEE_EMAIL"
            export GIT_COMMITTER_EMAIL="$GITEE_EMAIL"
          ' --tag-name-filter cat -- --all >/tmp/mirror-filter-branch.log 2>&1
          # filter-branch 默认留 refs/original 备份；不删的话推送 refspec 会把旧对象也带过去
          for r in $(git for-each-ref --format='%(refname)' refs/original); do
            git update-ref -d "$r"
          done
          rm -rf .git/refs/original
          if git for-each-ref --format='%(refname)' | while read r; do git log "$r" --format='%ae %ce'; done \
             | tr ' ' '\n' | sort -u | grep -v -x -F "$GITEE_EMAIL" | grep -q .; then
            echo "::error::镜像副本仍含非公开提交邮箱，拒绝推送以免被 Gitee hook 拒绝"
            exit 1
          fi

      # ⚠️ 不用 --mirror：GitHub 的 refs/pull/* 会被 Gitee 当隐藏引用拒绝
      #    （deny updating a hidden ref），显式同步 heads+tags。
      # ⚠️ token 不走 remote URL（防日志泄露），走 http.extraheader。
      - name: 单向镜像到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: codecloud-dev/${{ github.event.repository.name }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::未配置 GITEE_TOKEN secret，跳过镜像（请在仓库 Settings → Secrets 配置）"
            exit 1
          fi
          git remote add gitee "https://gitee.com/${GITEE_REPO}.git"
          git config --local "http.https://gitee.com/.extraheader" \
            "Authorization: Basic $(printf 'codecloud-dev:%s' "$GITEE_TOKEN" | base64 -w0)"
          # 连接被 reset 属地域阻断，同一路径重试意义有限：
          # 保留 2 次短重试，下一次定时同步（每 2 小时）会继续兜底。
          for attempt in 1 2; do
            echo "::group::镜像尝试第 $attempt 次"
            # 硬超时兜底：Gitee 连接可能僵死而不返回，git 自身无超时会让 job 永久 in_progress。
            # 单次给 300s，超时 SIGTERM，30s 后 SIGKILL；失败进入既有 3 次重试。
            if timeout --signal=TERM --kill-after=30s 300s git push --prune gitee "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"; then
              echo "::endgroup::"
              echo "镜像完成：$(git rev-parse --short HEAD) → gitee.com/${GITEE_REPO}"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Gitee 镜像同步失败（2 次尝试均失败）。GitHub 为唯一主源，本次同步未生效；下一次定时同步或手动触发会重试。持续失败通常是 runner 到 gitee.com 的地域性连接阻断，不是代码或凭证问题。"
              exit 1
            fi
            echo "::warning::第 $attempt 次镜像失败，15s 后重试"
            sleep 15
          done
