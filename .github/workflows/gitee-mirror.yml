name: 镜像到 Gitee（单向，GitHub 为唯一主源）
on:
  # 2026-11-13 审计：去掉 push 触发。
  # GitHub-hosted runner 在美国，实测到 gitee.com 的 git 连接稳定被
  # 「Recv failure: Connection reset by peer」阻断（run 43439774127 三次
  # 重试全挂，耗时 4m44s）。同一时刻从国内网络测 gitee.com 是 200 且
  # ls-remote 正常 —— 这是地域性网络阻断，不是代码或凭证问题。
  # 每次 push 都挂一个必红的 run 只会制造无意义告警；GitHub 本来就是唯一
  # 主源，镜像是单向冗余。改为定时同步 + 随时可手动补同步：
  # 定时 job 失败时仍真实 exit 1 并打印错误，不改成假绿。
  schedule:
    - cron: '23 */2 * * *'   # 每 2 小时兜底同步（原 6 小时，缩短同步窗口）
  workflow_dispatch:        # 允许手动触发补同步，或国内网络恢复后立即补推

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15     # 地域阻断时不要空耗 runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 全量历史，标签也要同步

      # ⚠️ 不用 --mirror：GitHub 的 refs/pull/* 会被 Gitee 当隐藏引用拒绝
      #    （deny updating a hidden ref），显式同步 heads+tags。
      # ⚠️ token 不走 remote URL（防日志泄露），走 http.extraheader。
      - name: 单向镜像到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: thousand-code-crafts/${{ github.event.repository.name }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::未配置 GITEE_TOKEN secret，跳过镜像（请在仓库 Settings → Secrets 配置）"
            exit 1
          fi
          git remote add gitee "https://gitee.com/${GITEE_REPO}.git"
          git config --local "http.https://gitee.com/.extraheader" \
            "Authorization: Basic $(printf 'thousand-code-crafts:%s' "$GITEE_TOKEN" | base64 -w0)"
          # 连接被 reset 属地域阻断，同一路径重试意义有限：
          # 保留 2 次短重试，下一次定时同步（每 2 小时）会继续兜底。
          for attempt in 1 2; do
            echo "::group::镜像尝试第 $attempt 次"
            if git push --prune gitee "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"; then
              echo "::endgroup::"
              echo "镜像完成：$(git rev-parse --short HEAD) → gitee.com/${GITEE_REPO}"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Gitee 镜像同步失败（2 次尝试均失败）。GitHub 为唯一主源，本次同步未生效；下一次定时同步或手动触发会重试。持续失败通常是 runner 到 gitee.com 的地域性连接阻断，不是代码或凭证问题。"
              exit 1
            fi
            echo "::warning::第 $attempt 次镜像失败，15s 后重试"
            sleep 15
          done
