<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 760 380" width="760" height="380" role="img"
     aria-label="moxsh-suite 套件动图：终端/插件/核心/官网四个模块围绕中央 mox 徽标错峰浮动">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1832"/>
      <stop offset="1" stop-color="#0d0b1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7bff"/>
      <stop offset="1" stop-color="#37d5d3"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="760" height="380" fill="url(#bg)"/>
  <text x="380" y="34" text-anchor="middle" fill="#ECEAFF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700">moxsh 家族 · 资产总入口</text>
  <text x="380" y="57" text-anchor="middle" fill="#9B96C9" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">脱离 Termux · 全面兼容 · 液态玻璃 · monorepo 一处收纳</text>
  <circle cx="380" cy="215" r="52" fill="#8a7bff" opacity="0.28" filter="url(#glow)"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="380" cy="215" r="44" fill="#241d44" stroke="#8a7bff" stroke-width="2"/>
  <text x="380" y="222" text-anchor="middle" fill="#fff" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700">mox</text>
  <g>
    <circle cx="380" cy="130" r="22" fill="#15122a" stroke="#37d5d3" stroke-width="2"/>
    <text x="380" y="135" text-anchor="middle" fill="#ECEAFF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">终端</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite" begin="0s"/>
  </g>
  <g>
    <circle cx="250" cy="270" r="22" fill="#15122a" stroke="#8a7bff" stroke-width="2"/>
    <text x="250" y="275" text-anchor="middle" fill="#ECEAFF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">插件</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3s" repeatCount="indefinite" begin="0.7s"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite" begin="0.7s"/>
  </g>
  <g>
    <circle cx="510" cy="270" r="22" fill="#15122a" stroke="#ff7ac3" stroke-width="2"/>
    <text x="510" y="275" text-anchor="middle" fill="#ECEAFF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">核心</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3s" repeatCount="indefinite" begin="1.4s"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite" begin="1.4s"/>
  </g>
  <g>
    <circle cx="380" cy="310" r="22" fill="#15122a" stroke="#ffd36b" stroke-width="2"/>
    <text x="380" y="315" text-anchor="middle" fill="#ECEAFF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">官网</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3s" repeatCount="indefinite" begin="2.1s"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite" begin="2.1s"/>
  </g>
  <text x="380" y="350" text-anchor="middle" fill="#9B96C9" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">五个模块分明，一处看清真机源码 / 官网 / 设计 / 文档 / 规范</text>
  <text x="380" y="366" text-anchor="middle" fill="#6f6a96" font-family="sans-serif" font-size="11">moxsh-suite — 移动 Linux 终端家族的总仓库</text>
</svg>
